[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec-lab"
version = "0.4.0"
description = "A deterministic AI-agent security incident and evaluation lab"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "uvicorn>=0.34,<1",
]
dashboard = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
dashboard-test = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "playwright>=1.50,<2",
  "pytest-playwright>=0.6,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
agentsec = "agentsec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentsec = [
  "resources/**/*.css",
  "resources/**/*.html",
  "resources/**/*.js",
  "resources/**/*.json",
  "resources/**/*.txt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not dashboard_e2e'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "dashboard_e2e: approved local-listener browser tests for the optional dashboard",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
