name: Phase 1 verification

# Security-sensitive MVP code is executed only after a human starts this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and development checks
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=agentsec --cov-report=term-missing
      - name: Build package
        run: python -m build
      - name: Audit Python dependencies
        run: python -m pip_audit

